<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Endereço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <form>
            <!-- Seção de Dados Básicos -->
            <div class="row mt-5">
                <h4>Dados básicos</h4>
            </div>
            <div class="row">
                <div class="col-12 col-sm-6 col-md-3">
                    <input type="text" class="form-control" placeholder="nome">
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <input type="text" class="form-control" placeholder="sobrenome">
                </div>
                <div class="col-12 col-sm-12 col-md-5">
                    <input type="email" class="form-control" placeholder="email">
                </div>
            </div>
            <!-- Seção de Dados da Entrega -->
            <div class="row mt-3">
                <h4>Dados da entrega</h4>
            </div>
            <div class="row mb-5">
                <div class="col-12 col-sm-6 col-md-3 d-flex">
                    <input type="text" class="form-control" placeholder="cep" id="cep"/>
                    <button type="button" class="btn btn-primary ms-1" id="btn-buscar-cep">Buscar</button> 
                    <span class="d-none spinner-border spinner-border-sm"></span>
                </div>
                <div class="col-12 col-sm-6 col-md-7">
                    <input type="text" class="form-control" placeholder="endereço" id="endereco">
                </div>
                <div class="col-12 col-sm-12 col-md-2">
                    <input type="number" class="form-control" placeholder="N#">
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Enviar pedido</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
